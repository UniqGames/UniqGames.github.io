name: Deploy website

# Publishes this repository to GitHub Pages. The site is plain static HTML, so
# there is no build step — the folder is uploaded as-is, minus the tooling.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a Pages publish that is already updating. Cancelling one
# leaves the deployment stuck, and the next run then waits until it times out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Header and footer are in sync across pages
        run: python3 tools/sync_shell.py --check
      - name: Internal links and assets resolve
        run: python3 tools/check_links.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site without the repository plumbing
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
