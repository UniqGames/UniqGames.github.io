name: Deploy website

# actions/deploy-pages aborts and cancels the Pages update at 10 minutes.
# This site stays on "updating_pages" past that, and the cancel throws away
# the publish. Upload the artifact, then wait without cancelling.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Header and footer are in sync across pages
        run: python3 tools/sync_shell.py --check
      - name: Internal links and assets resolve
        run: python3 tools/check_links.py
      - name: Stage the site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            --exclude '_site/' \
            ./ _site/
          test -f _site/CNAME
          test -f _site/.nojekyll
          test -f _site/yesblocks/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: https://uniqgames.net/
    steps:
      - uses: actions/checkout@v4
      - name: Publish and wait for Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/publish_pages.py
