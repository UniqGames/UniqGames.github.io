name: Deploy website

# Publishes the static site by updating the gh-pages branch. GitHub Pages
# builds that branch itself. The Actions artifact deploy was staying on
# "updating_pages" until it hit the 10 minute limit and cancelled the publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Header and footer are in sync across pages
        run: python3 tools/sync_shell.py --check
      - name: Internal links and assets resolve
        run: python3 tools/check_links.py
      - name: Publish the static site
        run: |
          rm -rf /tmp/site
          mkdir -p /tmp/site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            --exclude '_site/' \
            ./ /tmp/site/
          cd /tmp/site
          git init -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish site"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
